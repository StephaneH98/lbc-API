<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - MonApp</title>
    <link rel="stylesheet" href="../css/login.css">
    <script src="../scripts/env-config.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">🔐</div>
            <h1>Bienvenue</h1>
            <p class="subtitle">Connectez-vous pour continuer</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">Connexion</button>
            <button class="tab" onclick="switchTab('register')">Inscription</button>
        </div>

        <div class="alert alert-error" id="errorAlert"></div>
        <div class="alert alert-success" id="successAlert"></div>

        <!-- Formulaire de connexion -->
        <form id="login-form">
            <div id="login-message" class="message"></div>
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="votre@email.com" required>
            </div>
            <div class="form-group">
                <label for="login-password">Mot de passe</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">
                Se connecter
            </button>
            <div class="forgot-password">
                <a href="#" onclick="showForgotPassword(); return false;">Mot de passe oublié ?</a>
            </div>
        </form>

        <!-- Formulaire d'inscription -->
        <form id="register-form" class="hidden">
            <div id="register-message" class="message"></div>
            <div class="form-group">
                <label for="register-name">Nom complet</label>
                <input type="text" id="register-name" placeholder="Jean Dupont" required>
            </div>
            <div class="form-group">
                <label for="register-email">Email</label>
                <input type="email" id="register-email" placeholder="votre@email.com" required>
            </div>
            <div class="form-group">
                <label for="register-password">Mot de passe</label>
                <input type="password" id="register-password" placeholder="••••••••" required minlength="8">
            </div>
            <div class="form-group">
                <label for="register-confirm-password">Confirmer le mot de passe</label>
                <input type="password" id="register-confirm-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" id="registerBtn">
                Créer mon compte
            </button>
        </form>

        <!-- Formulaire de confirmation -->
        <form id="confirm-form" class="hidden">
            <div id="confirm-message" class="message"></div>
            <p class="confirm-message">
                Un code de vérification a été envoyé à votre email
            </p>
            <div class="form-group">
                <label for="confirm-email">Email</label>
                <input type="email" id="confirm-email" placeholder="votre@email.com" required readonly>
            </div>
            <div class="form-group">
                <label for="confirm-code">Code de vérification</label>
                <input type="text" id="confirm-code" placeholder="123456" required>
            </div>
            <button type="submit" class="btn btn-primary">
                Vérifier
            </button>
        </form>
    </div>
    <!-- Scripts -->
    <!-- 1️⃣ SDK Amazon Cognito -->
    <script src="../libs/amazon-cognito-identity.min.js"></script>

    <!-- 2️⃣ Configuration d'environnement -->
    <script src="../scripts/env-config.js"></script>

    <!-- 3️⃣ Configuration principale -->
    <script src="../scripts/config.js"></script>

    <!-- 4️⃣ Authentification -->
    <script src="../scripts/auth-cognito.js"></script>
</html>
