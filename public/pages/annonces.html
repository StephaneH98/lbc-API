<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏠 Annonces - Tableau</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/annonces.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div>
                    <h1>🏠 Annonces Immobilières</h1>
                    <p class="subtitle" id="fileNameDisplay">Chargement...</p>
                </div>
                <a href="file_selection.html" class="btn btn-secondary">
                    ← Retour à la sélection
                </a>
            </div>
        </header>

        <!-- Messages -->
        <div id="loading" class="loading-message">
            <div class="spinner"></div>
            <p>Chargement des annonces...</p>
        </div>

        <div id="error-message" class="error-message" style="display: none;"></div>

        <!-- Section statistiques prix moyen locations -->
        <div id="stats-container" class="stats-container" style="display: none;">
            <h2>📊 Statistiques - Prix moyen des locations</h2>
            <div id="stats-content" class="stats-content">
                <!-- Les statistiques seront insérées ici par JavaScript -->
            </div>

            <!-- Bouton pour enregistrer la recherche -->
            <div class="save-search-section">
                <button id="saveSearchBtn" class="btn-save-search">
                    <span class="btn-icon">💾</span>
                    <span class="btn-text">Enregistrer cette recherche</span>
                </button>
                <p class="save-search-hint">Sauvegardez vos résultats dans votre espace personnel</p>
            </div>
        </div>

        <!-- Container des annonces -->
        <div id="annonces-container" class="annonces-container" style="display: none;"></div>
    </div>

    <!-- Scripts -->
    <!-- 1️⃣ SDK Amazon Cognito -->
    <script src="../libs/amazon-cognito-identity.min.js"></script>

    <!-- 2️⃣ Configuration d'environnement -->
    <script src="../scripts/env-config.js"></script>

    <!-- 3️⃣ Configuration principale -->
    <script src="../scripts/config.js"></script>

    <!-- 4️⃣ Authentification -->
    <script src="../scripts/auth-cognito.js"></script>
    <script src="../scripts/auth-guard.js"></script>
    <script src="../scripts/auth-logout.js"></script>

    <!-- 5️⃣ Composant header avec déconnexion -->
    <script src="../scripts/header-component.js"></script>

    <!-- 6️⃣ Script de la page -->
    <script src="../scripts/annonces.js"></script>
</body>
</html>
