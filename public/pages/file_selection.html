<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏠 Gestion des Annonces - Sélection</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/file_selection.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🏠 Gestion des Annonces Immobilières</h1>
            <p class="subtitle">Tableau de bord administrateur</p>
        </header>

        <!-- Section de sélection du fichier -->
        <section class="file-selection-page">
            <div class="selection-card">
                <div class="card-icon">📂</div>
                <h2>Sélectionner un fichier d'annonces</h2>
                <p class="card-description">Choisissez un fichier JSON contenant les annonces à afficher</p>
                
                <!-- Bouton de chargement des fichiers -->
                <div class="action-section">
                    <button id="loadFilesBtn" class="btn btn-primary btn-large">
                        📥 Charger les fichiers disponibles
                    </button>
                </div>

                <!-- Sélecteur de fichier (caché au départ) -->
                <div id="fileSelectionSection" class="file-selector-wrapper" style="display: none;">
                    <div class="file-selector-group">
                        <label for="fileSelect" class="file-label">
                            <span class="label-icon">📄</span>
                            Fichier à afficher :
                        </label>
                        <select id="fileSelect" class="file-select">
                            <option value="">-- Chargement... --</option>
                        </select>
                    </div>

                    <!-- Info du fichier sélectionné -->
                    <div id="fileInfo" class="file-info-card" style="display: none;">
                        <h3>📋 Informations du fichier</h3>
                        <div class="info-grid">
                            <div class="info-item">
                                <span class="info-label">📝 Nom :</span>
                                <span id="infoFileName" class="info-value">-</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">📦 Taille :</span>
                                <span id="infoFileSize" class="info-value">-</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">🕒 Modifié :</span>
                                <span id="infoFileDate" class="info-value">-</span>
                            </div>
                        </div>
                    </div>

                    <!-- Bouton d'affichage -->
                    <button id="displayFileBtn" class="btn btn-success btn-large" disabled>
                        👁️ Afficher les annonces
                    </button>
                </div>

                <!-- Messages -->
                <div id="loading" class="loading-message" style="display: none;">
                    <div class="spinner"></div>
                    <p>Chargement en cours...</p>
                </div>

                <div id="error-message" class="error-message" style="display: none;"></div>
                <div id="success-message" class="success-message" style="display: none;"></div>
            </div>
        </section>
    </div>

    <script src="../scripts/file_selection.js"></script>
</body>
</html>
