<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sélection de fichier - LBC Analyzer</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/file_selection.css">
    
    <!-- Scripts -->
    <script src="../env-config.js" defer></script>
    <script src="../config.js" defer></script>
    <script src="../scripts/file_selection.js" defer></script>
</head>
<body>
    <!-- Loader -->
    <div id="loader" class="loader" style="display: none;">
        <div class="spinner"></div>
        <p>Chargement des fichiers...</p>
    </div>

    <!-- Conteneur d'erreur -->
    <div id="error-container" class="error-container" style="display: none;">
        <div class="error-content">
            <span class="error-icon">⚠️</span>
            <p id="error-message" class="error-message"></p>
            <button onclick="hideError()" class="error-close">✕</button>
        </div>
    </div>

    <!-- En-tête avec dégradé -->
    <header class="header">
        <div class="header-content">
            <div class="header-title">
                <h1>📁 Sélection de Fichier</h1>
                <p>Choisissez un fichier JSON à analyser</p>
            </div>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="main-content">
        <div class="container">
            
            <!-- Barre d'actions -->
            <div class="actions-bar">
                <button id="load-files-btn" class="refresh-btn">
                    <span class="btn-icon">🔄</span>
                    <span class="btn-text">Actualiser</span>
                </button>
                <div id="files-count" class="files-count">
                    📊 <span id="count-number">0</span> fichier(s)
                </div>
            </div>

            <!-- Grid des fichiers -->
            <div id="files-container" class="files-grid">
                <!-- Les cartes seront injectées ici -->
            </div>

            <!-- État vide -->
            <div id="empty-state" class="empty-state" style="display: none;">
                <div class="empty-icon">📭</div>
                <h2>Aucun fichier disponible</h2>
                <p>Il n'y a pas encore de fichiers JSON sur le serveur.</p>
                <button id="retry-btn" class="btn btn-primary">
                    🔄 Réessayer
                </button>
            </div>

        </div>
    </main>

    <!-- Pied de page -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 LBC Analyzer - Tous droits réservés</p>
        </div>
    </footer>

</body>
</html>
