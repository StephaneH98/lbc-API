version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "🔧 Début du build Amplify..."
        - echo "📍 Répertoire de travail:" && pwd
        - echo "📂 Fichiers présents:" && ls -la
        - echo ""
        - echo "🔑 Variables d'environnement disponibles:"
        - echo "  API_URL = $API_URL"
        - echo "  AWS_REGION = $AWS_REGION"
        - echo "  ENVIRONMENT = $ENVIRONMENT"
        - echo ""
    
    build:
      commands:
        - echo "🚀 Génération de public/env-config.js..."
        # Créer le fichier public/env-config.js avec les variables Amplify
        - |
          cat > public/env-config.js << 'EOF'
          // ⚠️ Fichier AUTO-GÉNÉRÉ par AWS Amplify
          // Les valeurs proviennent des variables d'environnement Amplify
          
          window.ENV = {
              API_URL: '$API_URL',
              PROXY_URL: '$PROXY_URL',
              BUCKET_NAME: '$BUCKET_NAME',
              REGION: '$AWS_REGION',
              COGNITO: {
                  USER_POOL_ID: '$COGNITO_USER_POOL_ID',
                  CLIENT_ID: '$COGNITO_CLIENT_ID',
                  REGION: '$AWS_REGION'
              },
              AUTH: {
                  LOGIN_PAGE: 'pages/login.html',
                  HOME_PAGE: '../index.html',
                  LOGOUT_REDIRECT: 'pages/login.html'
              }
          };
          
          console.log('Variables injectées par Amplify:');
          console.log('API_URL:', window.ENV.API_URL);
          console.log('PROXY_URL:', window.ENV.PROXY_URL);
          console.log('BUCKET_NAME:', window.ENV.BUCKET_NAME);
          console.log('REGION:', window.ENV.REGION);
          console.log('COGNITO_USER_POOL_ID:', window.ENV.COGNITO.USER_POOL_ID);
          console.log('COGNITO_CLIENT_ID:', window.ENV.COGNITO.CLIENT_ID);
          console.log('AUTH_LOGIN_PAGE:', window.ENV.AUTH.LOGIN_PAGE);
          console.log('AUTH_HOME_PAGE:', window.ENV.AUTH.HOME_PAGE);
          console.log('AUTH_LOGOUT_REDIRECT:', window.ENV.AUTH.LOGOUT_REDIRECT);
          EOF
        
        # Remplacer les placeholders par les vraies valeurs
        - sed -i "s|\$API_URL|$API_URL|g" public/env-config.js
        - sed -i "s|\$PROXY_URL|$PROXY_URL|g" public/env-config.js
        - sed -i "s|\$BUCKET_NAME|$BUCKET_NAME|g" public/env-config.js
        - sed -i "s|\$AWS_REGION|$AWS_REGION|g" public/env-config.js
        - sed -i "s|\$COGNITO_USER_POOL_ID|$COGNITO_USER_POOL_ID|g" public/env-config.js
        - sed -i "s|\$COGNITO_CLIENT_ID|$COGNITO_CLIENT_ID|g" public/env-config.js
        - sed -i "s|\$AUTH_LOGIN_PAGE|$AUTH_LOGIN_PAGE|g" public/env-config.js
        - sed -i "s|\$AUTH_HOME_PAGE|$AUTH_HOME_PAGE|g" public/env-config.js
        - sed -i "s|\$AUTH_LOGOUT_REDIRECT|$AUTH_LOGOUT_REDIRECT|g" public/env-config.js
        
        - echo "✅ public/env-config.js généré avec succès:"
        - cat public/env-config.js
        - echo ""
        - echo "📦 Fichiers finaux avant déploiement:"
        - ls -la

  artifacts:
    baseDirectory: public/pages
    files:
      - '**/*'
  cache:
    paths: []